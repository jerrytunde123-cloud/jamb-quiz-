<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quiz — UTME LAB</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body class="quiz-body">

<header class="quiz-header">
  <div class="brand-mini">UTME LAB</div>
  <div class="quiz-meta">
    <span id="nicknameBadge"></span>
    <span id="qCounter">Q 1 / 15</span>
    <span id="timer" class="timer">05:00</span>
  </div>
</header>

<div class="progress-bar"><div id="progress" class="progress-fill"></div></div>

<main class="quiz-container">
  <div id="questionBox" class="question-box">
    <p id="questionText" class="q-text">Loading…</p>
    <div id="questionImage" class="hidden"></div>
    <div id="options" class="options"></div>
  </div>

  <div class="quiz-controls">
    <button id="prevBtn" class="btn-ghost">Previous</button>
    <button id="nextBtn" class="btn-primary">Next</button>
    <button id="submitBtn" class="btn-success hidden">Submit</button>
  </div>
</main>

<!-- RESULT MODAL -->
<div id="resultModal" class="gate hidden">
  <div class="gate-card wide">
    <h3 id="resultTitle">Quiz Complete</h3>
    <p id="resultScore" class="big-score">0 / 15</p>
    <p id="resultMsg"></p>
    <p id="personalBest" class="best-line"></p>

    <div class="modal-actions">
      <button id="reviewBtn" class="btn-primary">
        <i class="fas fa-search"></i> Review Answers
      </button>
      <a id="retakeBtn" class="btn-ghost" href="#">Retake</a>
      <a class="btn-ghost" href="/">Home</a>
    </div>

    <div class="share-block">
      <p style="font-size:12px;color:var(--muted);margin-top:14px;margin-bottom:6px;">
        Challenge your friends
      </p>
      <a id="shareWaBtn" class="btn-wa" target="_blank" rel="noopener">
        <i class="fab fa-whatsapp"></i> Share on WhatsApp
      </a>
    </div>

    <!-- LEADERBOARD / COMMENTS TABS -->
    <div class="tabs-mini">
      <button class="active" data-pane="lb">🏆 Leaderboard</button>
      <button data-pane="cm">💬 Comments</button>
    </div>

    <div id="pane-lb" class="mini-pane">
      <div id="leaderboard" class="leaderboard">Loading…</div>
    </div>

    <div id="pane-cm" class="mini-pane hidden">
      <div id="commentList" class="comment-list"></div>
      <div class="comment-form">
        <input id="commentMsg" placeholder="Say something encouraging…" maxlength="200">
        <button id="commentSend" class="btn-primary">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ANSWER REVIEW MODAL -->
<div id="reviewModal" class="gate hidden">
  <div class="gate-card wide review-card">
    <div class="review-header">
      <h3><i class="fas fa-check-circle"></i> Answer Review</h3>
      <button id="reviewClose" class="close-x"><i class="fas fa-times"></i></button>
    </div>
    <p id="reviewSummary" class="review-summary"></p>
    <div id="reviewList" class="review-list"></div>
    <button id="reviewBackBtn" class="btn-primary" style="width:100%;margin-top:16px;">
      <i class="fas fa-arrow-left"></i> Back to Results
    </button>
  </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  onload="window.__katexReady = true"></script>
<script src="/js/quiz.js"></script>
</body>
</html>
