<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — UTME LAB</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/style.css" />
<style>
  .admin-wrap { max-width: 1100px; margin: 30px auto; padding: 20px; }
  .admin-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .admin-tabs button {
    padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; font-size: 14px;
  }
  .admin-tabs button.active { background: var(--gradient); color: #000; border: none; }
  .admin-panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 22px;
  }
  .form-row { display: grid; gap: 10px; margin-bottom: 12px; grid-template-columns: 1fr 1fr; }
  .form-row.full { grid-template-columns: 1fr; }
  .form-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .form-row input, .form-row select, .form-row textarea {
    width: 100%; padding: 10px; border-radius: 8px;
    border: 1px solid var(--border); background: #0d1117; color: var(--text);
    font-family: inherit; font-size: 14px;
  }
  .form-row textarea { min-height: 70px; resize: vertical; }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .admin-table th, .admin-table td {
    padding: 8px; border-bottom: 1px solid var(--border); text-align: left;
  }
  .admin-table tr:hover { background: rgba(245,166,35,0.06); }
  .pill { padding: 2px 8px; border-radius: 20px; background: var(--border); font-size: 11px; }
  .row-actions button { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 4px 8px; }
  .row-actions button:hover { color: var(--primary); }
  .search-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .search-bar input, .search-bar select {
    flex: 1; min-width: 150px; padding: 10px; border-radius: 8px;
    border: 1px solid var(--border); background: #0d1117; color: var(--text);
  }
  .toast {
    position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 10px;
    background: var(--success); color: white; font-weight: 600; z-index: 999;
    opacity: 0; transition: 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--danger); }
  .link-row {
    display: flex; gap: 8px; align-items: center;
    background: #0d1117; padding: 10px; border-radius: 8px;
    border: 1px solid var(--border);
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">SA</div>
    <div><h1>ADMIN PANEL</h1><span>UTME LAB · Question Manager</span></div>
  </div>
  <a href="/" class="btn-ghost" style="width:auto;text-decoration:none;padding:8px 16px;margin:0;">← Home</a>
</header>

<div class="admin-wrap">
  <div class="admin-tabs">
    <button data-tab="add" class="active">➕ Add Question</button>
    <button data-tab="bulk">📤 Bulk Upload</button>
    <button data-tab="list">📋 Manage Questions</button>
    <button data-tab="links">🔗 Share Links</button>
  </div>

  <!-- ADD -->
  <div class="admin-panel" id="tab-add">
    <h3 style="margin-bottom:14px;">Add New Question</h3>
    <div class="form-row">
      <div><label>Subject</label><input id="f-subject" placeholder="e.g. Mathematics"></div>
      <div><label>Year (optional)</label><input id="f-year" placeholder="JAMB 2023"></div>
    </div>
    <div class="form-row full">
      <div><label>Question</label><textarea id="f-question" placeholder="Enter question text…"></textarea></div>
    </div>
    <div class="form-row">
      <div><label>Option A</label><input id="f-a"></div>
      <div><label>Option B</label><input id="f-b"></div>
    </div>
    <div class="form-row">
      <div><label>Option C</label><input id="f-c"></div>
      <div><label>Option D</label><input id="f-d"></div>
    </div>
    <div class="form-row">
      <div>
        <label>Correct Answer</label>
        <select id="f-correct">
          <option value="0">A</option><option value="1">B</option>
          <option value="2">C</option><option value="3">D</option>
        </select>
      </div>
      <div><label>Image path (optional)</label><input id="f-image" placeholder="/images/xxx.jpg"></div>
    </div>
    <button class="btn-primary" id="btnSave" style="margin-top:10px;">Save Question</button>
  </div>

  <!-- BULK -->
  <div class="admin-panel hidden" id="tab-bulk">
    <h3 style="margin-bottom:14px;">Bulk Upload</h3>
    <p style="color:var(--muted); font-size:14px; margin-bottom:14px;">
      Paste a JSON array of questions.
    </p>
    <div class="form-row full">
      <div>
        <label>JSON Payload</label>
        <textarea id="bulk-json" style="min-height:300px;font-family:monospace;" placeholder='[{"subject":"Mathematics","question":"2+2?","optionA":"3","optionB":"4","optionC":"5","optionD":"6","correct":1}]'></textarea>
      </div>
    </div>
    <button class="btn-primary" id="btnBulk">Upload All</button>
  </div>

  <!-- LIST -->
  <div class="admin-panel hidden" id="tab-list">
    <h3 style="margin-bottom:14px;">Manage Questions</h3>
    <div class="search-bar">
      <input id="search-q" placeholder="Search question text…">
      <select id="search-subject"><option value="">All Subjects</option></select>
      <button class="btn-primary" id="btnSearch">Search</button>
    </div>
    <div id="listStatus" style="color:var(--muted); font-size:13px; margin-bottom:10px;"></div>
    <div style="max-height:520px; overflow-y:auto;">
      <table class="admin-table">
        <thead>
          <tr><th>ID</th><th>Subject</th><th>Question</th><th>Ans</th><th></th></tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </div>

  <!-- LINKS -->
  <div class="admin-panel hidden" id="tab-links">
    <h3 style="margin-bottom:14px;">Subject Share Links</h3>
    <p style="color:var(--muted); font-size:14px; margin-bottom:14px;">
      Copy any link below — share it on WhatsApp. Recipients must join both channels
      before their quiz unlocks.
    </p>
    <div class="search-bar">
      <input id="link-search" placeholder="Filter subjects…">
    </div>
    <div id="link-list" style="display:grid;gap:10px;"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const KEY = prompt('Enter admin key:') || localStorage.getItem('adminKey');
if (!KEY) { alert('Admin key required'); location.href = '/'; }
localStorage.setItem('adminKey', KEY);
const headers = { 'Content-Type': 'application/json', 'x-admin-key': KEY };

const f = id => document.getElementById(id).value.trim();

function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

// Tabs
document.querySelectorAll('.admin-tabs button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.admin-tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    ['add','bulk','list','links'].forEach(t =>
      document.getElementById('tab-' + t).classList.toggle('hidden', t !== b.dataset.tab));
    if (b.dataset.tab === 'list') loadList();
    if (b.dataset.tab === 'links') loadLinks();
  };
});

// Add
document.getElementById('btnSave').onclick = async () => {
  const body = {
    subject: f('f-subject'),
    year: f('f-year'),
    question: f('f-question'),
    optionA: f('f-a'), optionB: f('f-b'),
    optionC: f('f-c'), optionD: f('f-d'),
    correct: parseInt(f('f-correct')),
    image: f('f-image') || null
  };
  const r = await fetch('/api/admin/questions', {
    method: 'POST', headers, body: JSON.stringify(body)
  });
  const d = await r.json();
  if (d.ok) {
    toast('✅ Question added');
    ['f-question','f-a','f-b','f-c','f-d'].forEach(id =>
      document.getElementById(id).value = '');
  } else {
    toast('❌ ' + (d.error || 'Failed'), true);
  }
};

// Bulk
document.getElementById('btnBulk').onclick = async () => {
  let arr;
  try { arr = JSON.parse(document.getElementById('bulk-json').value); }
  catch { return toast('❌ Invalid JSON', true); }
  const r = await fetch('/api/admin/bulk', {
    method: 'POST', headers, body: JSON.stringify({ questions: arr })
  });
  const d = await r.json();
  if (d.ok) toast(`✅ Uploaded ${d.added} questions`);
  else toast('❌ ' + d.error, true);
};

// List
async function loadList() {
  const params = new URLSearchParams({
    q: document.getElementById('search-q').value,
    subject: document.getElementById('search-subject').value,
    limit: 100
  });
  const r = await fetch('/api/admin/questions?' + params, { headers });
  const d = await r.json();
  if (!d.rows) return toast('❌ Auth failed', true);

  document.getElementById('listStatus').textContent =
    `Showing ${d.rows.length} of ${d.total} questions`;

  document.getElementById('listBody').innerHTML = d.rows.map(q => `
    <tr>
      <td><span class="pill">${q.id}</span></td>
      <td>${q.subject}</td>
      <td>${(q.question || '').slice(0, 80)}${q.question.length > 80 ? '…' : ''}</td>
      <td>${'ABCD'[q.correct]}</td>
      <td class="row-actions">
        <button onclick="delQ('${q.id}')"><i class="fas fa-trash"></i></button>
      </td>
    </tr>`).join('');
}

window.delQ = async (id) => {
  if (!confirm('Delete this question?')) return;
  const r = await fetch('/api/admin/questions/' + id, { method: 'DELETE', headers });
  const d = await r.json();
  if (d.ok) { toast('🗑️ Deleted'); loadList(); }
};

document.getElementById('btnSearch').onclick = loadList;

// Share links
async function loadLinks() {
  const res = await fetch('/api/subjects');
  const list = await res.json();
  const filter = (document.getElementById('link-search').value || '').toLowerCase();
  const filtered = list.filter(s => s.subject.toLowerCase().includes(filter));
  const origin = location.origin;

  document.getElementById('link-list').innerHTML = filtered.map(s => {
    const slug = s.subject.toLowerCase().replace(/\s+/g, '-');
    const url = `${origin}/s/${slug}`;
    return `
      <div class="link-row">
        <div style="flex:1;">
          <div style="font-weight:600;font-size:13px;">${s.subject}</div>
          <div style="font-size:11px;color:var(--muted);word-break:break-all;">${url}</div>
        </div>
        <button class="btn-primary" style="padding:6px 12px;font-size:12px;"
          onclick="navigator.clipboard.writeText('${url}');this.textContent='✓';setTimeout(()=>this.textContent='Copy',1500);">
          Copy
        </button>
        <a href="https://wa.me/?text=${encodeURIComponent('Practice ' + s.subject + ' JAMB questions: ' + url)}"
           target="_blank" class="btn-wa" style="padding:6px 12px;font-size:12px;margin:0;width:auto;">
          <i class="fab fa-whatsapp"></i>
        </a>
      </div>
    `;
  }).join('');
}

document.getElementById('link-search').addEventListener('input', loadLinks);

// Load subjects dropdown
fetch('/api/subjects').then(r => r.json()).then(list => {
  document.getElementById('search-subject').innerHTML =
    '<option value="">All Subjects</option>' +
    list.map(s => `<option>${s.subject}</option>`).join('');
});
</script>
</body>
</html>
